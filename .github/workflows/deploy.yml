name: Build and Deploy Test Version

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - closed

permissions:
  contents: read

jobs:

  # ============================================================
  # BUILD AND DEPLOY TEST VERSION
  # Runs whenever a normal push is made to a non-main branch.
  # ============================================================
  deploy-test:
    if: >
      github.event_name == 'push' &&
      github.event.deleted == false

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout StoryWeb
      # --------------------------------------------------------
      - name: Checkout StoryWeb
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: npm ci

      # --------------------------------------------------------
      # Determine the branch directory name
      #
      # Example:
      # feature/town-system
      #
      # becomes:
      # feature-town-system
      # --------------------------------------------------------
      # - name: Create branch directory name
      #   id: branch
      #   shell: bash
      #   run: |
      #     BRANCH_NAME="${GITHUB_REF_NAME}"

      #     # Replace "/" and spaces with "-"
      #     SAFE_NAME="${BRANCH_NAME//\//-}"
      #     SAFE_NAME="${SAFE_NAME// /-}"

      #     # Remove anything that is not a letter, number,
      #     # period, underscore, or hyphen
      #     SAFE_NAME=$(echo "$SAFE_NAME" | sed 's/[^a-zA-Z0-9._-]//g')

      #     echo "Branch name: $BRANCH_NAME"
      #     echo "Safe directory name: $SAFE_NAME"

      #     echo "name=$SAFE_NAME" >> "$GITHUB_OUTPUT"

      #     # Tell Vite where this test build will live
      #     echo "VITE_BASE_PATH=/TinyRPG/Test/$SAFE_NAME/" >> "$GITHUB_ENV"

      # --------------------------------------------------------
      # Build StoryWeb
      #
      # Vite will use:
      #
      # /StoryWeb
      #
      # as its base path.
      # --------------------------------------------------------
      - name: Build StoryWeb
        run: npm run build

      # --------------------------------------------------------
      # Checkout website repository
      # --------------------------------------------------------
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: heheas/heheas.github.io
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: website

      # --------------------------------------------------------
      # Replace this branch's deployment
      # --------------------------------------------------------
      - name: Replace branch deployment
        run: |
          BRANCH_DIR="website/tools/StoryWeb"

          echo "Deploying to $BRANCH_DIR"

          rm -rf "$BRANCH_DIR"
          mkdir -p "$BRANCH_DIR"

          cp -R dist/. "$BRANCH_DIR/"

      # --------------------------------------------------------
      # Commit and push test deployment
      # --------------------------------------------------------
      - name: Commit and push deployment
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add StoryWeb

          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy latest StoryWeb"
            git push
          fi